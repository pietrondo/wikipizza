{% extends 'base.html' %}
{% block content %}
<h1>{{ page.title }}</h1>
<div class="mb-3">
{{ page.content | safe }}
</div>
<p>
    <a href="/" class="btn btn-secondary">Torna alla lista</a>
    <a href="/welcome" class="btn btn-secondary">Benvenuto</a>
    {% if current_user.is_authenticated %}
        <a href="/edit/{{ page.id }}" class="btn btn-primary">Modifica</a>
    {% endif %}
</p>
{% endblock %}
