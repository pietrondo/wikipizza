{% extends 'base.html' %}
{% block head %}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/simplemde/latest/simplemde.min.css">
{% endblock %}
{% block content %}
<h1>Modifica pagina</h1>
<form method="post">
  <div class="mb-3">
    <label class="form-label">Titolo</label>
    <input type="text" name="title" value="{{ page.title }}" class="form-control" required>
  </div>
  <textarea name="content" id="editor">{{ page.content }}</textarea>
  <button type="submit" class="btn btn-primary mt-2">Salva</button>
</form>
{% endblock %}
{% block scripts %}
<script src="https://cdn.jsdelivr.net/simplemde/latest/simplemde.min.js"></script>
<script>new SimpleMDE({ element: document.getElementById('editor') });</script>
{% endblock %}
